<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta - Darling Business Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 {
      color: #00ffcc;
    }
    input, button {
      padding: 12px;
      margin: 10px 0;
      width: 90%;
      max-width: 350px;
      border-radius: 8px;
      border: none;
    }
    input {
      background-color: #1e1e1e;
      color: white;
    }
    button {
      background-color: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    a {
      color: #00ffcc;
      text-decoration: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Criar Conta</h1>
  <input type="text" id="nome" placeholder="Nome completo" />
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="senha" placeholder="Senha" />
  <button onclick="cadastrar()">Cadastrar</button>
  <a href="index.html">Já tenho conta</a>

  <!-- Monetag Ads -->
  <script data-cfasync="false" type="text/javascript" src="//www.monetag.com/a/display.php?r=9931768"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3voRUhhaJUSiYUc7WnsN8iMXsNn84UNM",
      authDomain: "darling-clica-e-ganha.firebaseapp.com",
      projectId: "darling-clica-e-ganha",
      storageBucket: "darling-clica-e-ganha.firebasestorage.app",
      messagingSenderId: "993176761999",
      appId: "1:993176761999:web:2b6b692ec80250b637e2fa",
      measurementId: "G-ZTHNDPMTBN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function cadastrar() {
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        const uid = userCredential.user.uid;

        await setDoc(doc(db, "usuarios", uid), {
          nome: nome,
          email: email,
          pontos: 0,
          vip: false
        });

        window.location.href = "dashboard.html";
      } catch (error) {
        alert("Erro ao cadastrar: " + error.message);
      }
    }

    window.cadastrar = cadastrar;
  </script>
</body>
</html>
