<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Solicitar Saque</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
    }
    .card {
      background-color: #1f1f1f;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    input, select, button {
      display: block;
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #43a047;
    }
  </style>
</head>
<body>

  <h2>Solicitar Saque</h2>
  <div class="card">
    <label for="nome">Nome completo do titular</label>
    <input type="text" id="nome" required>

    <label for="metodo">Método de saque</label>
    <select id="metodo">
      <option value="iban">IBAN (BFA Angola)</option>
      <option value="binance">Binance (E-mail)</option>
      <option value="express">Express (Número de telefone)</option>
    </select>

    <label for="identificador">IBAN / E-mail / Telefone</label>
    <input type="text" id="identificador" required>

    <button onclick="solicitarSaque()">Enviar Solicitação</button>
  </div>

<script type="module">
  import { auth, db } from './firebase.js';
  import { doc, getDoc, updateDoc, collection, addDoc, query, where, getDocs } from "firebase/firestore";
  import { onAuthStateChanged } from "firebase/auth";

  let usuarioAtual = null;
  let dadosUsuario = null;

  async function solicitarSaque() {
    const nome = document.getElementById("nome").value.trim();
    const metodo = document.getElementById("metodo").value;
    const identificador = document.getElementById("identificador").value.trim();

    if (!nome || !identificador) {
      alert("Preencha todos os campos.");
      return;
    }

    const q = query(collection(db, "saques"), where("identificador", "==", identificador));
    const resultado = await getDocs(q);
    if (!resultado.empty) {
      alert("Este identificador já foi usado por outro usuário.");
      return;
    }

    const pontos = dadosUsuario.pontos || 0;
    const vip = dadosUsuario.vip || false;
    const valorDolar = pontos / 100;

    const limite = vip ? 15 : 5;
    if (valorDolar < limite) {
      alert(`Saque mínimo para seu plano é $${limite}. Você tem $${valorDolar.toFixed(2)}`);
      return;
    }

    await addDoc(collection(db, "saques"), {
      uid: usuarioAtual.uid,
      nome,
      metodo,
      identificador,
      pontos: pontos,
      valorDolar: valorDolar.toFixed(2),
      status: "pendente",
      data: new Date()
    });

    await updateDoc(doc(db, "usuarios", usuarioAtual.uid), { pontos: 0 });

    alert("Solicitação enviada com sucesso!");
    window.location.href = "dashboard.html";
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      usuarioAtual = user;
      const snap = await getDoc(doc(db, "usuarios", user.uid));
      if (snap.exists()) {
        dadosUsuario = snap.data();
      }
    } else {
      window.location.href = "index.html";
    }
  });

  window.solicitarSaque = solicitarSaque;
</script>

<!-- Monetag / PropellerAds -->
<script src="https://propu.sh/pfe/current/tag.min.js?z=7301773" data-cfasync="false" async></script>

</body>
</html>
