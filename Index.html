<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login - Darling Business Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 {
      color: #00ffcc;
    }
    input, button {
      padding: 12px;
      margin: 10px 0;
      width: 90%;
      max-width: 350px;
      border-radius: 8px;
      border: none;
    }
    input {
      background-color: #1e1e1e;
      color: white;
    }
    button {
      background-color: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    a {
      color: #00ffcc;
      text-decoration: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Login</h1>
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="senha" placeholder="Senha" />
  <button onclick="login()">Entrar</button>
  <a href="cadastro.html">Criar conta</a>

  <!-- Monetag Ads -->
  <script data-cfasync="false" type="text/javascript" src="//www.monetag.com/a/display.php?r=9931768"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3voRUhhaJUSiYUc7WnsN8iMXsNn84UNM",
      authDomain: "darling-clica-e-ganha.firebaseapp.com",
      projectId: "darling-clica-e-ganha",
      storageBucket: "darling-clica-e-ganha.firebasestorage.app",
      messagingSenderId: "993176761999",
      appId: "1:993176761999:web:2b6b692ec80250b637e2fa",
      measurementId: "G-ZTHNDPMTBN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function login() {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      signInWithEmailAndPassword(auth, email, senha)
        .then(() => {
          window.location.href = "dashboard.html";
        })
        .catch(error => {
          alert("Erro ao entrar: " + error.message);
        });
    }

    window.login = login;
  </script>
</body>
</html>
