<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Darling Business Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <!-- Monetag Ads (PropellerAds) -->
  <script data-cfasync="false" type="text/javascript" src="//upgulpinon.com/1?z=7194511"></script>

  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      color: #03dac6;
      text-align: center;
    }
    .saldo {
      text-align: center;
      margin: 20px 0;
    }
    .saldo span {
      display: block;
      font-size: 24px;
    }
    button {
      width: 100%;
      background: #03dac6;
      color: black;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background: #02c2b0;
    }
    .links {
      text-align: center;
      margin-top: 30px;
    }
    .links a {
      color: #03dac6;
      text-decoration: none;
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h2>Bem-vindo à Darling Business Earn</h2>
  <div class="saldo">
    <span id="pontos">Pontos: 0</span>
    <span id="dolares">$0.00</span>
  </div>
  <button onclick="assistirAnuncio()">Assistir Anúncio</button>

  <div class="links">
    <a href="vip.html">Plano VIP</a>
    <a href="saque.html">Solicitar Saque</a>
    <a href="#" onclick="logout()">Sair</a>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCNZL9KmVbM7D1m3fZlvTNgUXqS78a3NDo",
      authDomain: "darling-willian-clica-e-ganha.firebaseapp.com",
      projectId: "darling-willian-clica-e-ganha",
      storageBucket: "darling-willian-clica-e-ganha.appspot.com",
      messagingSenderId: "360974768097",
      appId: "1:360974768097:web:a04e7c8e0e27dbdc7de3d3"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let userId;

    auth.onAuthStateChanged(user => {
      if (user) {
        userId = user.uid;
        carregarPontos();
      } else {
        window.location.href = "index.html";
      }
    });

    function carregarPontos() {
      db.collection("usuarios").doc(userId).get().then(doc => {
        const dados = doc.data();
        const pontos = dados.pontos || 0;
        document.getElementById("pontos").textContent = "Pontos: " + pontos;
        document.getElementById("dolares").textContent = "$" + (pontos / 100).toFixed(2);
      });
    }

    function assistirAnuncio() {
      // Monetag popup ad trigger (fake ação)
      window.open("https://www.google.com", "_blank");

      db.collection("usuarios").doc(userId).update({
        pontos: firebase.firestore.FieldValue.increment(10)
      }).then(() => {
        carregarPontos();
      });
    }

    function logout() {
      auth.signOut().then(() => {
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
