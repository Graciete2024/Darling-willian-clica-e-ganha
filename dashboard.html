<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Darling Business Earn</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .header, .main {
      padding: 20px;
    }
    .card {
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 0 5px rgba(255,255,255,0.1);
    }
    button {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>Bem-vindo ao Dashboard</h1>
  <p id="pontos">Pontos: ... | $...</p>
  <button onclick="logout()">Sair</button>
</div>

<div class="main">
  <div class="card">
    <h3>Ganhe Pontos</h3>
    <button onclick="ganharPontos()">Assistir Anúncio</button>
  </div>
  <div class="card">
    <h3>Status VIP</h3>
    <p id="vipStatus">Carregando...</p>
  </div>
  <div class="card">
    <a href="vip.html"><button>Ativar VIP</button></a>
    <a href="saque.html"><button>Solicitar Saque</button></a>
  </div>
</div>

<!-- Scripts -->
<script type="module">
  import { auth, db } from './firebase.js';
  import { doc, getDoc, updateDoc } from "firebase/firestore";
  import { onAuthStateChanged, signOut } from "firebase/auth";

  function atualizarInterface(user, dados) {
    const pontos = dados.pontos || 0;
    const vip = dados.vip ? "Ativo" : "Inativo";
    const dolares = (pontos / 100).toFixed(2);
    document.getElementById("pontos").innerText = `Pontos: ${pontos} | $${dolares}`;
    document.getElementById("vipStatus").innerText = `VIP: ${vip}`;
  }

  async function ganharPontos() {
    const user = auth.currentUser;
    if (user) {
      const ref = doc(db, "usuarios", user.uid);
      const snap = await getDoc(ref);
      const pontos = (snap.data().pontos || 0) + 10;
      await updateDoc(ref, { pontos });
      atualizarInterface(user, { ...snap.data(), pontos });
      alert("Você ganhou 10 pontos!");
    }
  }

  function logout() {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const ref = doc(db, "usuarios", user.uid);
      const snap = await getDoc(ref);
      if (snap.exists()) {
        atualizarInterface(user, snap.data());
      }
    } else {
      window.location.href = "index.html";
    }
  });

  window.ganharPontos = ganharPontos;
  window.logout = logout;
</script>

</body>
</html>
