<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Darling Business Earn</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #00ffcc;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 20px;
      margin: 20px auto;
      width: 90%;
      max-width: 400px;
    }
    button {
      background-color: #00ffcc;
      color: black;
      padding: 15px 30px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
    #logout {
      background-color: crimson;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Bem-vindo!</h1>
  <div class="card">
    <h2 id="pontos">Pontos: 0 | $0.00</h2>
    <button onclick="assistirAnuncio()">Assistir Anúncio</button>
    <p id="vipStatus">Plano: Normal</p>
    <p id="bonusInfo">Bônus: 0</p>
  </div>
  <button id="logout" onclick="logout()">Sair</button>

  <!-- Monetag Popunder -->
  <script data-cfasync="false" type="text/javascript" src="//www.monetag.com/a/display.php?r=9931768"></script>
  <!-- Interstitial -->
  <script async="async" data-cfasync="false" src="//pl20952997.profitablegatecpm.com/abefc729ce1e4a1b58f7c1f4f5de7f0d/invoke.js"></script>
  <div id="container-abefc729ce1e4a1b58f7c1f4f5de7f0d"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3voRUhhaJUSiYUc7WnsN8iMXsNn84UNM",
      authDomain: "darling-clica-e-ganha.firebaseapp.com",
      projectId: "darling-clica-e-ganha",
      storageBucket: "darling-clica-e-ganha.firebasestorage.app",
      messagingSenderId: "993176761999",
      appId: "1:993176761999:web:2b6b692ec80250b637e2fa",
      measurementId: "G-ZTHNDPMTBN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const pontosEl = document.getElementById("pontos");
    const vipEl = document.getElementById("vipStatus");
    const bonusEl = document.getElementById("bonusInfo");

    let usuarioRef;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        usuarioRef = doc(db, "usuarios", user.uid);
        const docSnap = await getDoc(usuarioRef);

        if (docSnap.exists()) {
          const dados = docSnap.data();
          atualizarTela(dados);
        }
      } else {
        window.location.href = "index.html";
      }
    });

    function atualizarTela(dados) {
      const pontos = dados.pontos || 0;
      const vip = dados.vip ? "VIP" : "Normal";
      const bonus = dados.bonus || 0;
      const dolares = (pontos / 100).toFixed(2);
      pontosEl.textContent = `Pontos: ${pontos} | $${dolares}`;
      vipEl.textContent = `Plano: ${vip}`;
      bonusEl.textContent = `Bônus: ${bonus}`;
    }

    async function assistirAnuncio() {
      const docSnap = await getDoc(usuarioRef);
      if (docSnap.exists()) {
        let dados = docSnap.data();
        let novosPontos = (dados.pontos || 0) + 10;
        await updateDoc(usuarioRef, { pontos: novosPontos });
        atualizarTela({ ...dados, pontos: novosPontos });
      }
    }

    function logout() {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
