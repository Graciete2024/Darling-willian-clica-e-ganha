<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Darling Business Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .saldo {
      font-size: 20px;
      font-weight: bold;
    }
    button {
      background-color: #00ffcc;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    .vip {
      margin-top: 20px;
      padding: 15px;
      background-color: #1e1e1e;
      border-radius: 10px;
    }
    .logout {
      margin-top: 30px;
      color: #00ffcc;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="topo">
    <div id="boasVindas">Bem-vindo</div>
    <div class="saldo" id="pontosDisplay">Pontos: 0 | $0.00</div>
  </div>

  <button onclick="assistirAnuncio()">Assistir Anúncio</button>

  <div class="vip" id="statusVip">Plano: Normal</div>

  <div class="logout" onclick="logout()">Sair</div>

  <!-- Monetag Ads -->
  <script data-cfasync="false" type="text/javascript" src="//www.monetag.com/a/display.php?r=9931768"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3voRUhhaJUSiYUc7WnsN8iMXsNn84UNM",
      authDomain: "darling-clica-e-ganha.firebaseapp.com",
      projectId: "darling-clica-e-ganha",
      storageBucket: "darling-clica-e-ganha.firebasestorage.app",
      messagingSenderId: "993176761999",
      appId: "1:993176761999:web:2b6b692ec80250b637e2fa",
      measurementId: "G-ZTHNDPMTBN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioRef = null;
    let usuarioData = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        usuarioRef = doc(db, "usuarios", user.uid);
        const docSnap = await getDoc(usuarioRef);
        if (docSnap.exists()) {
          usuarioData = docSnap.data();
          document.getElementById("boasVindas").innerText = "Olá, " + usuarioData.nome;
          atualizarDashboard();
        }
      } else {
        window.location.href = "index.html";
      }
    });

    async function assistirAnuncio() {
      if (!usuarioRef) return;
      usuarioData.pontos += 100;
      await updateDoc(usuarioRef, { pontos: usuarioData.pontos });
      atualizarDashboard();
    }

    function atualizarDashboard() {
      const dolares = (usuarioData.pontos / 100).toFixed(2);
      document.getElementById("pontosDisplay").innerText = `Pontos: ${usuarioData.pontos} | $${dolares}`;
      document.getElementById("statusVip").innerText = usuarioData.vip ? "Plano: VIP" : "Plano: Normal";
    }

    function logout() {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    }

    window.assistirAnuncio = assistirAnuncio;
    window.logout = logout;
  </script>
</body>
</html>
